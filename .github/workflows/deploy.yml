name: Deploy Bot

# 本番の再起動を伴うため、承認後に手動実行する。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        # SSHでログインするための便利なプログラム（アクション）を使います
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_IP }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          # ここからが、サーバーの中で実行させる「実際のコマンド」です
          script: |
            set -eu
            cd ~/atcoder-stats-bot
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart discord-bot
